[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "procuremind-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.6,<3", "sqlalchemy>=2.0,<3", "pymupdf>=1.24,<2", "openai>=2,<3", "python-multipart>=0.0.20,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.services.assurance" = ["migrations/*.sql"]
"app.services.simulation" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
